<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yeux</title>
    <!-- Google Fonts: Bebas Neue for Jennie Shop menu style, Cinzel for Logo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Lock page to a single full screen (No main page scrolling) */
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
        }

        /* 1. Header (Left menu icon =, Center logo) */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), transparent);
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 26px;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
        }

        .logo-title {
            font-family: 'Cinzel', serif;
            font-size: 30px;
            font-weight: 500;
            font-style: italic;
            letter-spacing: 4px;
            text-transform: lowercase;
            color: #ffffff;
            text-decoration: none;
        }

        .header-spacer {
            width: 26px;
        }

        /* 2. Fullscreen Single Page Hero Cover (IMG_4798.jpeg) */
        .hero-screen {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%), url('IMG_4798.jpeg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-title {
            font-family: 'Cinzel', serif;
            font-size: 68px;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 8px;
            text-transform: lowercase;
            color: #ffffff;
        }

        .hero-subtitle {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #dddddd;
            margin-top: 14px;
        }

        /* 3. Left Slide Drawer (Identical UI to Jennie's shopasia.jenn.ie menu) */
        .drawer-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .drawer-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .left-drawer {
            position: fixed;
            top: 0;
            left: -100%;
            width: 85%;
            max-width: 360px;
            height: 100vh;
            background-color: #ffffff; /* Clean White Drawer Menu */
            color: #000000;
            z-index: 300;
            padding: 36px 30px;
            display: flex;
            flex-direction: column;
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 8px 0 30px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        .left-drawer.active {
            left: 0;
        }

        .drawer-close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #000000;
            align-self: flex-start;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .drawer-menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .drawer-menu-list a {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 34px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #000000;
            text-decoration: none;
            transition: opacity 0.2s;
            display: block;
        }

        .drawer-menu-list a:hover {
            opacity: 0.5;
        }

        .magazine-sub-links {
            margin-top: 10px;
            padding-left: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .magazine-sub-links a {
            font-family: 'Inter', sans-serif !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            text-transform: none !important;
            color: #555555 !important;
            letter-spacing: 0.5px !important;
        }

        .magazine-sub-links a:hover {
            color: #000000 !important;
        }

        /* 4. Category Fullscreen Popup Overlay (Opened when clicking a menu item) */
        .category-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(22, 22, 22, 0.96);
            backdrop-filter: blur(16px);
            z-index: 400;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s ease;
            display: flex;
            flex-direction: column;
            padding: 80px 24px 40px;
            overflow-y: auto;
        }

        .category-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .category-modal-close {
            position: fixed;
            top: 24px;
            right: 28px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            z-index: 450;
            font-weight: 300;
        }

        .modal-inner {
            max-width: 580px;
            width: 100%;
            margin: 0 auto;
        }

        .modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 40px;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .modal-text {
            font-size: 14px;
            color: #cccccc;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .feed-card {
            background-color: #2e2e2e;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #3d3d3d;
            margin-bottom: 24px;
        }

        .feed-card img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
        }

        .feed-card .caption {
            padding: 14px 16px;
            font-size: 12px;
            color: #aaaaaa;
            display: flex;
            justify-content: space-between;
        }

        .pdf-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 20px;
        }

        .pdf-link-card {
            background-color: #2e2e2e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #3d3d3d;
            text-decoration: none;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .pdf-link-card:hover {
            border-color: #ffffff;
        }

        .pdf-link-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
        }

        .pdf-link-btn {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <!-- 1. Header (Menu icon =, Center Logo) -->
    <header>
        <button class="menu-toggle-btn" onclick="openDrawer()">☰</button>
        <a href="#" class="logo-title">yeux</a>
        <div class="header-spacer"></div>
    </header>

    <!-- 2. Single Page Fullscreen Landing Cover -->
    <div class="hero-screen">
        <div class="hero-title">yeux</div>
        <div class="hero-subtitle">Visual & Editorial Archive</div>
    </div>

    <!-- 3. Left Slide Drawer Navigation -->
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
    <div class="left-drawer" id="leftDrawer">
        <button class="drawer-close-btn" onclick="closeDrawer()">✕</button>
        <ul class="drawer-menu-list">
            <li><a href="#" onclick="openCategoryModal('what-is-yeux')">- WHAT IS YEUX</a></li>
            <li><a href="#" onclick="openCategoryModal('fashion')">- FASHION</a></li>
            <li><a href="#" onclick="openCategoryModal('wedding')">- WEDDING</a></li>
            <li><a href="#" onclick="openCategoryModal('casa')">- CASA</a></li>
            <li><a href="#" onclick="openCategoryModal('idea')">- IDEA</a></li>
            <li><a href="#" onclick="openCategoryModal('picture')">- PICTURE</a></li>
            <li>
                <a href="#" onclick="openCategoryModal('yeux-magazine')">- YEUX MAGAZINE</a>
                <div class="magazine-sub-links">
                    <a href="yeux_for_me.pdf" target="_blank">• yeux. for me.pdf</a>
                    <a href="yeux_runway.pdf" target="_blank">• yeux. runway.pdf</a>
                    <a href="yeux_vivi.pdf" target="_blank">• yeux. vivi.pdf</a>
                </div>
            </li>
        </ul>
    </div>

    <!-- 4. Category Content Popups (Only displays when a menu item is clicked) -->
    <div class="category-modal" id="modalOverlay">
        <button class="category-modal-close" onclick="closeCategoryModal()">✕</button>
        <div class="modal-inner" id="modalContent">
            <!-- Dynamic content injected via JS -->
        </div>
    </div>

    <script>
        // Drawer toggle functions
        function openDrawer() {
            document.getElementById('leftDrawer').classList.add('active');
            document.getElementById('drawerBackdrop').classList.add('active');
        }

        function closeDrawer() {
            document.getElementById('leftDrawer').classList.remove('active');
            document.getElementById('drawerBackdrop').classList.remove('active');
        }

        // Category content data
        const categoryData = {
            'what-is-yeux': `
                <div class="modal-title">- WHAT IS YEUX</div>
                <p class="modal-text">yeux is a personal archive gathering photography, high-fashion runways, wedding inspirations, interior & furniture designs, and creative visual fragments.</p>
            `,
            'fashion': `
                <div class="modal-title">- FASHION</div>
                <div class="feed-card">
                    <img src="IMG_4798.jpeg" alt="Fashion">
                    <div class="caption"><span>Fashion Archive #01</span><span>2026</span></div>
                </div>
            `,
            'wedding': `
                <div class="modal-title">- WEDDING</div>
                <div class="feed-card">
                    <img src="IMG_4798.jpeg" alt="Wedding">
                    <div class="caption"><span>Wedding Inspiration #01</span><span>2026</span></div>
                </div>
            `,
            'casa': `
                <div class="modal-title">- CASA</div>
                <div class="feed-card">
                    <img src="IMG_4798.jpeg" alt="Casa">
                    <div class="caption"><span>Casa & Living #01</span><span>2026</span></div>
                </div>
            `,
            'idea': `
                <div class="modal-title">- IDEA</div>
                <div class="feed-card">
                    <img src="FB081821-C8D5-437C-ACF0-600BCD0CADCD.jpeg" alt="Idea">
                    <div class="caption"><span>Visual Idea #01</span><span>2026</span></div>
                </div>
            `,
            'picture': `
                <div class="modal-title">- PICTURE</div>
                <div class="feed-card">
                    <img src="IMG_4798.jpeg" alt="Picture">
                    <div class="caption"><span>Photography Archive #01</span><span>2026</span></div>
                </div>
            `,
            'yeux-magazine': `
                <div class="modal-title">- YEUX MAGAZINE</div>
                <p class="modal-text">Curated PDF magazine series from the yeux collection.</p>
                <div class="pdf-grid">
                    <a href="yeux_for_me.pdf" target="_blank" class="pdf-link-card">
                        <span class="pdf-link-title">yeux. for me</span>
                        <span class="pdf-link-btn">Open PDF →</span>
                    </a>
                    <a href="yeux_runway.pdf" target="_blank" class="pdf-link-card">
                        <span class="pdf-link-title">yeux. runway</span>
                        <span class="pdf-link-btn">Open PDF →</span>
                    </a>
                    <a href="yeux_vivi.pdf" target="_blank" class="pdf-link-card">
                        <span class="pdf-link-title">yeux. vivi</span>
                        <span class="pdf-link-btn">Open PDF →</span>
                    </a>
                </div>
            `
        };

        function openCategoryModal(catId) {
            closeDrawer();
            const content = categoryData[catId];
            if (content) {
                document.getElementById('modalContent').innerHTML = content;
                document.getElementById('modalOverlay').classList.add('active');
            }
        }

        function closeCategoryModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
    </script>
</body>
</html>
